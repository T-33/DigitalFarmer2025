version: '3.8'

services:
  backend:
    build: ./api
    container_name: murab-backend
    ports:
      - "8000:8000"
    environment:
      - PLANT_ID_API_KEY=${PLANT_ID_API_KEY:-}
      - DEBUG=${DEBUG:-true}
      - HOST=0.0.0.0
      - PORT=8000
      - API_VERSION=v1
      - DATABASE_URL=sqlite+aiosqlite:///./murab.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://bot:3000
      - MOCK_PLANT_ID=true
      - MOCK_WEATHER=true
    volumes:
      - ./api:/app
      - api_data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - murab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build: ./bot
    container_name: murab-bot
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_API_URL=http://backend:8000/api/v1
      - API_TIMEOUT=30
      - DEBUG=${DEBUG:-true}
    volumes:
      - ./bot:/app
    command: python main.py
    restart: unless-stopped
    networks:
      - murab-network

volumes:
  api_data:
    driver: local

networks:
  murab-network:
    driver: bridge
